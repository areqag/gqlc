// The schema the emitted-decoder corpus runs against. One emission has to
// reach the arms the entity decoders carry, so between them these types
// declare a width that narrows from its driver carrier, a nullable
// property, a FLAT list, a list over a narrow element width, a list over
// each of the two slice shapes the driver hands back as themselves, a
// list of no declared element shape, and a property of no declared shape
// at all.
//
// ONE nesting depth, where there were three. Under ADR 0035 the neo4j
// server will not hold a list of lists as a stored property, so a
// declaration nesting deeper is refused at generation and cannot appear
// here at all. What that removed, and where it went:
//
//   - Listy.matrix and Edgy.matrix (LIST<LIST<INT64>>), Bin.piles
//     (LIST<LIST<ANY VALUE>>) and the whole Nest type, which declared
//     nothing but nested widths;
//   - Slot.windows (LIST<LIST<DATE>>), the depth-2 PARAMETER bind — see
//     the note above SlotsMatching in the queries file, which records
//     what its removal costs and why nothing replaces it.
//
// The decode arm those declarations reached was render_models.go's
// writeSliceNarrow recursive arm, which the same ruling makes
// unreachable by construction on this backend. It is DELETED in the same
// change, so there is no longer an arm here for this corpus to cover.
//
// A nested list arriving as a QUERY VALUE is still served by neo4j and
// still decoded, by a different emitter binding a different local family
// (render_queries.go, inner<n>/innerAcc<n>). That path keeps its witness
// — NestColumns below, respelled over literals rather than over declared
// properties. bd gqlc-415l carries the depth-3 live scenario.
//
// Those widths are declared on node types, so they are decoded off
// dbtype.Node. Edgy declares eight of them again to be decoded off
// dbtype.Relationship: a narrowing scalar (rank), a narrowing nullable
// (weight), a walked list (ranks), a walked list whose elements arrive
// as themselves (blobs), a walked nullable list (depths), an unwalked
// nullable list of no declared element shape (loose), a non-nullable
// property of no declared shape (payload), and a nullable one (spare).
// A decode helper is emitted per entity, so a narrow or a null one
// helper was shown to survive has not been run through another.
//
// Those eight land on six arms, not eight. writeEntityFieldDecode
// branches six ways — nullable and non-nullable, each over walked slice,
// narrow-convert and plain assign — and writeShapelessFieldDecode
// carries two more. ranks used to share the non-nullable walked-slice
// arm with matrix, the two differing only in how deep writeSliceNarrow
// recursed; with matrix gone ranks reaches that arm alone, and the
// recursion depth is no longer varied here by anything. blobs shares
// that arm too, and what it varies is one level down: which of
// writeSliceNarrow's three ELEMENT cases the walk that arm emits then
// takes. No arm of the eight now stands reached off dbtype.Node alone.
// The last one that did was the nullable shapeless read (out.Maybe = &v
// in decodeAnything) until spare put it on a relationship, and the
// non-nullable plain assign (out.Loose = value1 in decodeBin) until
// Edgier did the same.
//
// A helper shown to survive on one entity says nothing about another,
// and the emitter writes one shapeless-nullable arm that both carriers
// share, so the row for spare was measured against a carrier-specific
// mutation rather than a blanket one: emitting that arm's Props lookup
// as `ok && false` for EntityEdge alone reddens
// TestEdgySpareSeparatesAbsentFromNullOverARelationship and leaves
// TestAnythingSeparatesAbsentFromNull green.
//
// blobs is the row for the walk's DEFAULT element case (bd gqlc-np7s).
// Its elements are the one kind the driver hands back already the width
// the schema declared, so the walk asserts straight to them and appends
// what it asserted — writeSliceNarrow's default case, where
// carrier == elem. ranks and depths both take the case above it, the
// per-element narrowing call, so before blobs the default case ran off
// dbtype.Node alone. Its Go type is [][]byte, two slice prefixes, and it
// is the only property that can carry two under ADR 0035: the nesting is
// inside BYTES rather than in the declared list, so Phase Z has nothing
// to refuse.
//
// Measured the way spare was, carrier-specific: emitting that case's
// append as `append(dst, v0, v0)` for EntityEdge alone reddens
// TestEdgyNarrowsOverARelationship on the Blobs assertion and leaves
// TestListyNarrowsEachElement green. The same mutation against this
// fixture as it stood before blobs — with the mutant verified present in
// the tree — ran the whole corpus green, which is the state this row
// ends. Appending a zero value was the first mutant tried and is not the
// one to use: it leaves v0 unused, so the child module fails to build
// and the compiler kills the mutant before any test can.
//
// LIST<TIMESTAMP> is NOT a second such property, though bd gqlc-np7s
// listed it as one. Its element type is time.Time, which is its own
// driver carrier and is not one of the five neutral temporal carriers
// (codegen.TemporalCarriers), so a TIMESTAMP element takes the same
// default case blobs takes and would witness nothing blobs does not.
// The 'time' import it was thought to gate is decided over every entity
// in the emission at once (anyTime, render_models.go), so Listy.stamps
// already sets it and no edge property can move it.
//
// The third element case — a temporal carrier, narrowed through the
// emitted to<X> helper — is reached by no DECODED property here at all.
// Slot.days is this fixture's only list of one, and Slot exists for the
// encode direction; nothing projects it. bd gqlc-abf6t carries that.
//
// Edgier is declared for the query columns rather than for a width the
// node types had left unreached. A whole-entity column commits to a
// dbtype carrier and hands the value to the entity's own helper; a
// column whose pattern admits more than one edge type dispatches on the
// wire label before it picks a helper, which takes a second label one
// pattern can reach — and a distinct label per candidate, because
// codegen refuses a union two of whose candidates carry the same one
// (ErrUnrepresentableEdgeUnion, prepare.go's admitEdgeUnionCandidates).
// Its one property is a non-nullable STRING, whose driver carrier is
// its own Go type, so decodeEdgier is where the plain assign named
// above runs off a relationship.
// Slot is declared for the ENCODE direction and for nothing else. Every
// other type here is read: its widths pick a decode arm, and the tests
// hand the emission a driver value and ask what the caller gets back.
// Slot's widths are never decoded — no query projects it — they exist to
// be the thing a parameter is compared against, because a parameter's Go
// type is derived from the property it is compared to and there is no
// other way to ask for one.
//
// Three list widths for three of the four bind expressions a list
// parameter can take: one the driver's own packer walks element by
// element and so needs no conversion (tags), one whose leaf is a gqlc
// neutral carrier and so owes a per-element widen (days), and a nullable
// one whose helper carries the pointer through (spans). LIST<DURATION>
// rather than a second LIST<DATE> because the helpers are emitted per
// carrier, so a nullable list helper shown to work for one carrier has
// not been run for another.
//
// The fourth was windows (LIST<LIST<DATE>>), the per-element widen at a
// second nesting depth, and it is GONE rather than replaced: a
// parameter's Go type is derived from the property it is compared to,
// and ADR 0035 leaves no neo4j property of that width to compare one
// against. The depth>=2 encode helpers in render_temporal.go keep their
// recursion and lose their only witness here.
// Scalar.tally is the one UNSIGNED width here, and it is declared for the
// range check rather than for a decode arm — uint64 rides the same int64
// carrier and takes the same arm rank already reaches. What it alone
// witnesses is the sign clause: for every other width the round-trip
// int64(T(v)) != v catches an unrepresentable carrier, but uint64 is the
// case where the round-trip is a bijection, so uint64(-1) survives it and
// only the sign comparison refuses. Without an unsigned property the
// clause has no test that dies when it is deleted (bd gqlc-awtb).
CREATE PROPERTY GRAPH TYPE Neo4jCorpus AS {
    (:Slot {
        id      :: INT64 NOT NULL,
        tags    :: LIST<STRING NOT NULL> NOT NULL,
        days    :: LIST<DATE NOT NULL> NOT NULL,
        spans   :: LIST<DURATION(DAY TO SECOND) NOT NULL>
    }),
    (:Scalar {
        id     :: INT64 NOT NULL,
        rank   :: INT32 NOT NULL,
        active :: BOOL NOT NULL,
        name   :: STRING,
        weight :: FLOAT32,
        tally  :: UINT64 NOT NULL
    }),
    (:Listy {
        tags   :: LIST<STRING> NOT NULL,
        ranks  :: LIST<INT32> NOT NULL,
        blobs  :: LIST<BYTES> NOT NULL,
        stamps :: LIST<TIMESTAMP> NOT NULL,
        marks  :: LIST<DATE> NOT NULL,
        depths :: LIST<FLOAT32>
    }),
    (:Bin {
        loose :: LIST NOT NULL,
        bag   :: LIST<ANY VALUE>
    }),
    (:Anything {
        payload :: ANY VALUE NOT NULL,
        maybe   :: ANY VALUE
    }),
    (:AnyProp {
        badge :: ANY PROPERTY VALUE NOT NULL,
        tag   :: ANY PROPERTY VALUE
    }),
    (:Scalar) -[:Edgy {
        rank    :: INT32 NOT NULL,
        ranks   :: LIST<INT32> NOT NULL,
        blobs   :: LIST<BYTES> NOT NULL,
        payload :: ANY VALUE NOT NULL,
        loose   :: LIST,
        depths  :: LIST<FLOAT32>,
        weight  :: FLOAT32,
        spare   :: ANY VALUE
    }]-> (:Listy),
    (:Scalar) -[:Edgier {
        tag :: STRING NOT NULL
    }]-> (:Listy)
}
