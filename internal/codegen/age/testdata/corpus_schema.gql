// The schema the emitted-helper corpus runs against. One emission has to
// reach every decode arm the helpers carry, so between them these types
// declare each agtype scalar, a width that narrows from its carrier, a
// nullable property, an entity with no properties at all, an edge, a
// list at two nesting depths and over a narrow element width, and a
// property of no declared shape at all.
//
// Event carries the TIMESTAMP width in both nullabilities, which is what
// puts the instant helpers and the offset-sidecar read into the
// emission. agtype has no temporal value, so what a TIMESTAMP means on
// the wire is decided entirely by those helpers and by nothing the Go
// type checker can see.
//
// Span carries the other three temporal widths for the same reason, and
// DATE in both nullabilities. They ride the neutral carriers, so a Go
// compiler that sees a Date where a LocalTime belongs is the whole of
// what it can catch: which bytes each width means on the wire, and which
// of them are refused, is decided entirely by the helpers this schema
// puts into the emission.
//
// Meeting carries the second zoned width, TIME, in both nullabilities.
// It is a label of its own rather than a fourth property of Span because
// a zoned width derives an offset sidecar and the zoneless three do not,
// so what Meeting puts into the emission is the day-wrapping arithmetic
// and a second re-zoning helper — neither of which any other label here
// reaches.
// Person.tally is the one UNSIGNED width here, and it is declared for the
// range check rather than for a decode arm — uint64 rides the same int64
// carrier and takes the same arm rank already reaches. What it alone
// witnesses is the sign clause: for every other width the round-trip
// int64(T(v)) != v catches an unrepresentable carrier, but uint64 is the
// case where the round-trip is a bijection, so uint64(-1) survives it and
// only the sign comparison refuses. Without an unsigned property the
// clause has no test that dies when it is deleted (bd gqlc-awtb).
CREATE PROPERTY GRAPH TYPE AgeCorpus AS {
    (:Event {
        id         :: INT64     NOT NULL,
        occurredAt :: TIMESTAMP NOT NULL,
        seenAt     :: TIMESTAMP
    }),
    (:Meeting {
        id       :: INT64                NOT NULL,
        startsAt :: TIME WITH TIME ZONE  NOT NULL,
        endsAt   :: TIME WITH TIME ZONE
    }),
    (:Span {
        startsOn :: DATE       NOT NULL,
        endsOn   :: DATE,
        opensAt  :: LOCAL TIME NOT NULL,
        lasts    :: DURATION(DAY TO SECOND) NOT NULL
    }),
    (:Person {
        id         :: INT64 NOT NULL,
        name       :: STRING NOT NULL,
        score      :: FLOAT NOT NULL,
        active     :: BOOL NOT NULL,
        rank       :: INT32 NOT NULL,
        tally      :: UINT64 NOT NULL,
        middleName :: STRING,
        weight     :: FLOAT32
    }),
    (:Marker),
    (:Tricky {
        name :: STRING NOT NULL
    }),
    (:Listy {
        tags   :: LIST<STRING> NOT NULL,
        ranks  :: LIST<INT32> NOT NULL,
        matrix :: LIST<LIST<INT64>> NOT NULL,
        depths :: LIST<FLOAT32>
    }),
    (:Anything {
        payload :: ANY VALUE NOT NULL,
        maybe   :: ANY VALUE,
        tag     :: ANY PROPERTY VALUE
    }),
    (:Person) -[:ACTED_IN { since :: INT64 NOT NULL }]-> (:Person)
}
