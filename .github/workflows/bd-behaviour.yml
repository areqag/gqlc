# Re-checks the ONE third-party behaviour .githooks/bd-gh-sync's pull ordering
# rests on: that `bd update -d` moves the bead's `updated_at` (bd gqlc-1oe1,
# successor to gqlc-3205).
#
# WHY IT IS NOT IN `just test`. bd is a Dolt-backed external binary. `just test`
# is also the pre-push hook, so anything added there is paid on every local push
# by every citizen, and this repository treats wall-time as critical.
# .githooks/tests/bd-gh-sync-test.sh stubs bd on PATH and drives fixture JSON,
# so it can never observe the real CLI — and a stub encodes belief, not witness.
# This workflow is where the REAL binary runs at the boundary.
#
# WHY IT IS NOT A MERGE GATE, said plainly so nobody mistakes it for one. The
# claim under test is about a binary this repository does not own and does not
# vendor; a bd release, a GitHub release outage, or a Dolt engine change would
# block every unrelated PR at 4am for a reason no PR author can fix. The same
# argument .github/scripts/check-cron-freshness.sh makes for failing CLOSED runs
# the other way here: a broken assumption in bd is a latched state someone must
# act on, but it is not urgent within one merge. So this is an ALARM — a red run
# in the Actions UI and on the PRs that touch the sync — and its id must stay
# OFF master's required-check list.
#
# WHAT A GREEN RUN WITNESSES. Measured first-party 2026-08-23 against bd 1.0.4
# (ce242a879) and bd 1.2.2 (6c124203e), throwaway workspaces, git env cleared:
# both moved `updated_at` on a description edit, and both answered
# `bd show --json` with an ARRAY. This workflow installs the LATEST bd release,
# not the pinned one, deliberately: the point is to learn that a future bd
# breaks the assumption BEFORE the town upgrades to it.
#
# WHAT A GREEN RUN DOES NOT WITNESS. It does not run .githooks/bd-gh-sync. It
# checks the premise the script's dated header records, not the script's use of
# it. And the negative arm below falsifies the COMPARATOR, not the field read;
# a bd that renamed `updated_at` outright is caught instead by the non-empty and
# parseable assertions on the before value.
#
# GitHub disables cron workflows repo-wide after 60 days of inactivity, which
# would silence this one. It needs no freshness check of its own:
# codegen-live.yml is the daily cron and goes stale first, and ci.yml's tidy job
# already watches it. The disablement is a single repo-wide event.
name: bd-behaviour

on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - .githooks/bd-gh-sync
      - .githooks/tests/bd-gh-sync-test.sh
      - .github/workflows/bd-behaviour.yml
      - docs/bd-ledger-writes.md

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  bd-updated-at:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No checkout of bd's source and no `go install`: the release tarball is
      # a download and an untar, which is what keeps this cheap enough to be
      # worth having at all. Retried, because a GitHub download is exactly the
      # thing this repository has watched answer 429 (bd gqlc-flko).
      - name: install the latest released bd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo gastownhall/beads --json tagName --jq .tagName)"
          version="${tag#v}"
          url="https://github.com/gastownhall/beads/releases/download/${tag}/beads_${version}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -o "${RUNNER_TEMP}/beads.tar.gz" "$url"
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/beads.tar.gz" bd
          install -m 0755 "${RUNNER_TEMP}/bd" "$HOME/.local/bin/bd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "bd update -d moves updated_at"
        run: |
          set -euo pipefail
          bd version

          # Every scratch path allocated, never spelled, and removed on the
          # failure path too.
          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT

          # git exports GIT_DIR and friends into hook and step environments, and
          # bd follows them out of the workspace and into whatever repository
          # they name. Cleared, or the probe writes to the checkout.
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE

          # The comparator, separated from the bd interaction so the negative arm
          # below can drive it directly. Seconds since epoch, not string order:
          # a format change in bd must show up as a parse failure here, not as a
          # silently wrong lexicographic comparison.
          assert_moved() {
              local before="$1" after="$2"
              local before_s after_s
              if [ -z "$before" ] || [ "$before" = "null" ]; then
                  echo "the before value is empty or null. bd no longer answers with an" >&2
                  echo "updated_at this probe can read, which is itself the regression." >&2
                  return 1
              fi
              before_s="$(date -u -d "$before" +%s)" || return 1
              after_s="$(date -u -d "$after" +%s)" || return 1
              if [ "$after_s" -le "$before_s" ]; then
                  echo "updated_at did not move: before=$before after=$after" >&2
                  return 1
              fi
              return 0
          }

          cd "$workspace"
          bd init --prefix probe --non-interactive
          id="$(bd create "updated_at probe" --json | jq -r '.id')"
          test -n "$id"

          # bd's timestamps are rendered at second resolution, so an edit inside
          # the same second is indistinguishable from no edit at all. This sleep
          # is the difference between measuring bd and measuring the clock.
          before="$(bd show "$id" --json | jq -r '.[0].updated_at')"
          sleep 2
          bd update "$id" -d "a description this bead did not have before"
          after="$(bd show "$id" --json | jq -r '.[0].updated_at')"

          echo "before=$before after=$after"

          if ! assert_moved "$before" "$after"; then
              {
                  echo "### bd no longer moves updated_at on a description edit"
                  echo
                  echo "\`.githooks/bd-gh-sync\` orders a bead against its GitHub mirror on"
                  echo "\`bd.updated_at\` vs \`gh.updatedAt\`. With updated_at frozen, every"
                  echo "prefix-relation pair reads as \"GitHub not newer\" and the fail-open"
                  echo "residue widens silently. bd version: $(bd version)"
                  echo
                  echo "before=\`$before\` after=\`$after\` (bd gqlc-1oe1)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

          # The falsifier gqlc-1oe1 asks for, run in-band on every run rather
          # than performed once by hand and written down. A comparator that
          # cannot refuse is a gate that cannot fire, and this arm is what makes
          # the PASS above mean something. It falsifies the comparator only —
          # see the header for what it does not reach.
          if assert_moved "$before" "$before" 2>/dev/null; then
              echo "::error title=This check cannot fail::the comparator accepted an" \
                   "unchanged timestamp, so the PASS above witnesses nothing (bd gqlc-1oe1)."
              exit 1
          fi
          if assert_moved "" "$after" 2>/dev/null; then
              echo "::error title=This check cannot fail::the comparator accepted an empty" \
                   "before value, so a renamed field would read as a pass (bd gqlc-1oe1)."
              exit 1
          fi
          echo "comparator refuses an unchanged timestamp and an absent one; the pass above is a measurement."

  # The write-side contract that docs/bd-ledger-writes.md rests on, and the
  # release recipe in kingdom/brain/playbooks/citizen-protocol.md with it (bd
  # gqlc-o6kp). Measured first-party 2026-08-24 against bd 1.0.4 (ce242a879, the
  # deployed binary) and bd 1.2.2 (6c124203e, then the latest release): every row
  # below was identical on both.
  #
  # A SEPARATE JOB, not more steps on bd-updated-at, because the two claims are
  # independent — a bd that broke `updated_at` and a bd that went quiet on a
  # refused write are different upgrades to be warned about, and a shared job
  # reports only the first to fail. The install step is duplicated rather than
  # factored into a composite action; fourteen lines twice is cheaper to read
  # than a second file to open.
  #
  # SAME ALARM, NOT A GATE. See this file's header: the claims are about a binary
  # this repository neither owns nor vendors, so this job's id must stay OFF
  # master's required-check list.
  bd-write-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install the latest released bd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo gastownhall/beads --json tagName --jq .tagName)"
          version="${tag#v}"
          url="https://github.com/gastownhall/beads/releases/download/${tag}/beads_${version}_linux_amd64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL \
            --retry 5 --retry-all-errors --retry-delay 3 \
            -o "${RUNNER_TEMP}/beads.tar.gz" "$url"
          tar -C "${RUNNER_TEMP}" -xzf "${RUNNER_TEMP}/beads.tar.gz" bd
          install -m 0755 "${RUNNER_TEMP}/bd" "$HOME/.local/bin/bd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: "a refused bd update is loud, total, and writes nothing"
        run: |
          set -uo pipefail
          # The runner wraps run-steps in `bash -e`, and this step provokes
          # refusals on purpose: capturing one into out="$(bd update ...)"; rc=$?
          # is exactly the assignment shape errexit kills. Failures accumulate
          # through bad() instead, so errexit is turned off here deliberately.
          set +e
          bd version

          workspace="$(mktemp -d)"
          trap 'rm -rf "$workspace"' EXIT

          # git exports GIT_DIR and friends into step environments, and bd
          # follows them out of the workspace and into whatever repository they
          # name. Cleared, or the probe writes to the checkout.
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE

          fail=0
          ok()  { printf 'ok   - %s\n' "$1"; }
          bad() { fail=1; printf 'FAIL - %s\n' "$1"; }

          # THE COMPARATOR, kept apart from every bd interaction so the falsifier
          # arm at the end can drive it with values bd never produced. A refusal
          # must be all three things at once: non-zero, silent on stdout, and
          # without effect. Any one alone is satisfied by a bd that has gone quiet
          # in a way this repository's guidance would then be wrong about.
          assert_refused() {
              local rc="$1" out="$2" before="$3" after="$4"
              if [ "$rc" -eq 0 ]; then
                  echo "exit status was 0 — the refusal is invisible to every caller that checks it" >&2
                  return 1
              fi
              case "$out" in
                  *"Updated issue"*)
                      echo "stdout carried a success line on a refused write: $out" >&2
                      return 1 ;;
              esac
              if [ "$before" != "$after" ]; then
                  echo "the bead moved on a refused write: before=$before after=$after" >&2
                  return 1
              fi
              return 0
          }

          cd "$workspace"
          bd init --prefix probe --non-interactive
          a="$(bd create "write contract probe A" --json | jq -r '.id')"
          b="$(bd create "write contract probe B" --json | jq -r '.id')"
          if [ -z "$a" ] || [ -z "$b" ]; then
              echo "probe beads could not be created; the rows below prove nothing"
              exit 1
          fi

          BLOCKED='{"status":"blocked","assignee":"somebody"}'
          peek()  { bd show "$1" --json | jq -c '.[0]|{status,assignee}'; }
          reset() { bd update "$a" --status blocked --assignee somebody >/dev/null 2>&1; }

          # --- refusals ---------------------------------------------------------
          # Each row pairs a VALID intent with a bad one, so a pass means the
          # valid half was discarded too. A bd that applied the good half and
          # dropped the bad one would leave a bead half-released, which is the
          # state this family of incidents is about.
          #
          # The unknown flag is deliberately absurd rather than the `-l` of the
          # originating incident: `-l` is `bd create`'s labels flag, and a future
          # bd that adds it to `update` would redden this row for a reason that is
          # not a regression.
          refusal_row() {
              local name="$1"; shift
              local before after out rc
              reset
              before="$(peek "$a")"
              out="$(bd update "$a" "$@" 2>/dev/null)"; rc=$?
              after="$(peek "$a")"
              if assert_refused "$rc" "$out" "$before" "$after"; then
                  ok "$name"
              else
                  bad "$name (rc=$rc stdout='$out' before=$before after=$after)"
              fi
          }

          refusal_row "an unknown flag discards the valid --status beside it" \
              --status open --frobnicate-the-widget x
          refusal_row "an invalid --status value discards the valid --assignee beside it" \
              --assignee "" --status bogus
          refusal_row "an out-of-range --priority discards the valid --status beside it" \
              --status open --priority 9

          # --- the documented two-field release still applies BOTH fields -------
          # The rule above is only tolerable because the release recipe every
          # citizen is told to type is not caught by it.
          reset
          bd update "$a" --assignee "" --status open >/dev/null 2>&1
          released="$(peek "$a")"
          if [ "$released" = '{"status":"open","assignee":null}' ]; then
              ok 'bd update <id> --assignee "" --status open applies both fields'
          else
              bad "the two-field release applied something else: $released — kingdom/brain/playbooks/citizen-protocol.md tells every citizen to type exactly this to make a bead routable again"
          fi

          # --- a success line is not a write ------------------------------------
          reset
          before="$(peek "$a")"
          out="$(bd update "$a" --status blocked --assignee somebody 2>/dev/null)"; rc=$?
          after="$(peek "$a")"
          if [ "$rc" -eq 0 ] && [ "$before" = "$after" ]; then
              case "$out" in
                  *"Updated issue"*)
                      ok "an update that changes nothing still prints a success line — read back, never trust the tick" ;;
                  *)
                      bad "a no-op update no longer prints a success line (stdout='$out'). That is an IMPROVEMENT — bd now distinguishes accepted from applied — and docs/bd-ledger-writes.md should stop telling citizens the tick means nothing." ;;
              esac
          else
              bad "the no-op probe did not no-op (rc=$rc before=$before after=$after), so the row it was meant to establish proves nothing"
          fi

          # --- update is per-id best-effort; close is all-or-nothing -------------
          # Pinned in both directions because the guidance is asymmetric: name one
          # bead per `bd update` you intend to verify by exit status, while
          # `bd close` may be trusted with several.
          reset
          out="$(bd update "$a" "no-such-bead-zzz" --status open 2>/dev/null)"; rc=$?
          after="$(peek "$a")"
          if [ "$rc" -eq 0 ] && [ "$after" != "$BLOCKED" ]; then
              ok "bd update with one unresolvable id exits 0 having written the others"
          else
              bad "bd update with one unresolvable id now exits rc=$rc (after=$after). If it refuses the whole command, that is an IMPROVEMENT and the one-id-per-update rule in docs/bd-ledger-writes.md can be dropped."
          fi

          before_b="$(bd show "$b" --json | jq -r '.[0].status')"
          bd close "$b" "no-such-bead-zzz" >/dev/null 2>&1; rc=$?
          after_b="$(bd show "$b" --json | jq -r '.[0].status')"
          if [ "$rc" -ne 0 ] && [ "$before_b" = "$after_b" ]; then
              ok "bd close with one unresolvable id refuses the whole command and writes nothing"
          else
              bad "bd close with one unresolvable id: rc=$rc, $before_b -> $after_b. It no longer resolves every id before writing, so it shares bd update's partial-write shape and the asymmetry section of docs/bd-ledger-writes.md is wrong."
          fi

          # --- THE FALSIFIER ----------------------------------------------------
          # Every refusal row above is a call to assert_refused. A comparator that
          # cannot refuse is a job that cannot fire, so it is driven here with one
          # input per condition it claims to test — in band, on every run, rather
          # than performed once by hand and written down.
          if assert_refused 0 "" '{"x":1}' '{"x":1}' 2>/dev/null; then
              echo "::error title=This check cannot fail::the comparator accepted rc=0 as a refusal (bd gqlc-o6kp)."
              fail=1
          fi
          if assert_refused 1 "✓ Updated issue: probe-1 — x" '{"x":1}' '{"x":1}' 2>/dev/null; then
              echo "::error title=This check cannot fail::the comparator accepted a success line on stdout as a refusal (bd gqlc-o6kp)."
              fail=1
          fi
          if assert_refused 1 "" '{"x":1}' '{"x":2}' 2>/dev/null; then
              echo "::error title=This check cannot fail::the comparator accepted a bead that MOVED as a refusal, so a partial write would read as a pass (bd gqlc-o6kp)."
              fail=1
          fi
          echo "comparator refuses rc=0, a success line, and a moved bead; the rows above are measurements."

          if [ "$fail" -ne 0 ]; then
              {
                  echo "### bd's write contract has changed"
                  echo
                  echo "\`docs/bd-ledger-writes.md\` and the release recipe in"
                  echo "\`kingdom/brain/playbooks/citizen-protocol.md\` rest on the rows above."
                  echo "Read the failing row before fixing anything: some of them fail on an"
                  echo "IMPROVEMENT in bd and ask for the documentation to be relaxed."
                  echo
                  echo "bd version: $(bd version) (bd gqlc-o6kp)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi
