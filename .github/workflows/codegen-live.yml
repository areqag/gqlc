# Boots real backends and drives the generated repositories against them.
# Split into one job per backend because the two are on different triggers.
#
# live-smoke is PR-blocking (bd gqlc-73h shipped the original v5-only smoke; bd
# gqlc-5gc added the v6 arm sharing the same image; bd gqlc-9u5 enabled Go's
# test cache; bd gqlc-rvw promoted it to blocking). Wall-time is affordable
# because the Go test cache keeps the average PR cost near-zero — cache-miss
# only occurs when the test binary is actually invalidated, so only
# codegen-adjacent PRs pay the ~30s container-boot cost. No paths: filter —
# Go's test cache is the primary skip mechanism; adding path filters would
# risk false skips on new codegen-adjacent packages.
#
# live-smoke-age is PR-blocking too, since bd gqlc-ezwae. It was nightly and
# manual only (bd gqlc-35yu.8) on the ground that its containers are wall-time a
# pull request should not be charged — an argument locked 2026-07-31, BEFORE the
# arm existed to be measured. Measured since (bd gqlc-zase): the AGE arm takes
# 55-58s where the neo4j arm every PR already runs takes 73-116s on the SAME
# runs, and the two jobs share a startedAt, so they are parallel runners and the
# PR critical path does not move at all. Flake against it: 30 of 30 scheduled
# nightlies green, 2026-08-06..2026-09-04. Those numbers are a claim about
# today's tree and expire if this battery ever outgrows the neo4j arm's
# duration; whoever grows it past ~73s re-weighs the trade with them in hand.
#
# No paths: filter here either, and for a second reason on top of live-smoke's.
# A workflow-level one would filter live-smoke as well, and a required context
# that never reports leaves every non-matching PR pending forever; a job-level
# one needs a hand-kept list of what affects AGE emission, whose first stale
# entry recreates the unwitnessed merge this arm was put on PRs to close, one
# layer down and silently (bd gqlc-zase, rejected alternative 1).
#
# Nightly cron on master is retained for both as a safety net in case a
# merge-time race sneaks a codegen change past the PR gate; workflow_dispatch
# is retained for developer-triggered manual iteration.
name: codegen-live

on:
  pull_request:
  # live-smoke is required, so it must run on the merge group too or the
  # queue would land a merge result it never smoked (decision 0010). live-smoke-age
  # stays off it, by the positive enumeration on that job below.
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # This id is the check context master's branch protection requires, so
  # renaming the job detaches the merge gate silently.
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key-suffix: -${{ hashFiles('test/data/codegen/go.sum') }}
      - uses: ./.github/actions/setup-just
      - run: just test-codegen-live-neo4j

  # This id is a required context of master's protection, like live-smoke above,
  # so renaming the job detaches that gate silently.
  #
  # It runs on pull requests, the nightly cron and manual dispatch, and is
  # skipped on merge groups alone. Requiring it is only safe because it never
  # skips on a pull request: GitHub counts a skipped check as SATISFYING a
  # required context, so an id that skipped there would be a green gate that
  # graded nothing — which is what this id was, and why it was kept off the
  # required list until bd gqlc-ezwae put it on every PR.
  #
  # That caveat survives for merge_group, where this job still skips. A required
  # context absent from the merge group blocks a queue, so before any merge
  # queue is enabled here this job has to join merge_group first. No queue is
  # possible today (user-owned repo, bd gqlc-9vzmw); whoever changes that
  # re-opens decision 0010 rather than discovering this comment afterwards.
  #
  # Enumerated positively rather than as `!= 'merge_group'`: that negative shape
  # went TRUE on a merge group when it was written `!= 'pull_request'`, charging
  # every queued merge the AGE container wall-time (decision 0010). The
  # enumeration is also what internal/liverecipes reads: the events below are
  # declared in liverecipes.ArmTriggers and checked against this line, because a
  # job that stops running reports a skipped check and a skipped check is green.
  live-smoke-age:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          cache-key-suffix: -${{ hashFiles('test/data/codegen/go.sum') }}
      - uses: ./.github/actions/setup-just
      - run: just test-codegen-live-age

  # bd gqlc-0oau. A red nightly is the only signal that the MERGED tree has a
  # live regression — pull requests now smoke both arms, but each one smokes its
  # own merge ref rather than what master became, and a merge race landing a
  # break past two green PR gates has three instances on record. By default a
  # red scheduled run notifies GitHub's own default recipient (the last
  # committer to the cron file) and nobody else. An email nobody owns is not a
  # gate. This turns the failure into a durable artefact instead: one tracking
  # issue, reopened and commented on every failing night, closed by hand when
  # the regression is.
  #
  # Scheduled runs only. On workflow_dispatch a person is already watching the
  # run they started, and on a pull request both arms' red checks are the signal
  # and they block the merge; neither needs an issue, and filing one on a
  # developer's manual dispatch would train people to ignore the issue that
  # matters.
  #
  # `always()` is what lets this job run at all after a needed job failed;
  # without it the job is skipped exactly when it is wanted. `cancelled` is in
  # the condition beside `failure` because a nightly the runner killed also
  # produced no verdict on AGE, and silence is the failure mode this closes.
  #
  # NOT covered here, and filed rather than left implicit: GitHub disables
  # cron-triggered workflows after 60 days with no repository activity, and it
  # does so repo-wide, so no other cron in this tree can witness it. Only a
  # PR-triggered check can, and whether that check should block merges is
  # unresolved (bd gqlc-zqa3).
  nightly-alert:
    needs: [live-smoke, live-smoke-age]
    if: >-
      ${{ always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure')
      || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: open or update the nightly-red tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEO4J_RESULT: ${{ needs.live-smoke.result }}
          AGE_RESULT: ${{ needs.live-smoke-age.result }}
        run: |
          set -euo pipefail
          label='nightly-red'
          title='codegen-live nightly is red'

          # --force so a re-run over an existing label is not an error. Creating
          # the label here rather than relying on it existing keeps this job
          # working in a fresh fork or after someone tidies the label list.
          gh label create "$label" --color B60205 \
              --description 'the scheduled codegen-live run failed (bd gqlc-0oau)' \
              --force

          body="$(printf '%s\n' \
              "The scheduled \`codegen-live\` run failed." \
              "" \
              "- live-smoke (neo4j): \`${NEO4J_RESULT}\`" \
              "- live-smoke-age: \`${AGE_RESULT}\`" \
              "- run: ${RUN_URL}" \
              "" \
              "Pull requests exercise both arms pre-merge, so what this schedule is the" \
              "only witness of is the MERGED tree: a regression two green PR gates raced" \
              "past sits on master until this is read. Close this issue when the nightly" \
              "is green again; the next failing night reopens it.")"

          # --state all: a closed tracking issue is reopened rather than
          # duplicated, so the history of every red night stays on one thread.
          num="$(gh issue list --label "$label" --state all --limit 1 \
              --json number --jq '.[0].number // ""')"

          if [ -z "$num" ]; then
            gh issue create --title "$title" --label "$label" --body "$body"
            exit 0
          fi

          state="$(gh issue view "$num" --json state --jq '.state')"
          if [ "$state" = "CLOSED" ]; then
            gh issue reopen "$num"
          fi
          gh issue comment "$num" --body "$body"
