# The always-run merge-blocking checks: lint / test / tidy / actionlint.
# tidy and actionlint are fast (< 30 s); they gate the slow jobs (lint, test,
# codegen-fence) so a trivial formatting miss cancels expensive work early.
# Tool versions are pinned once, in the justfile.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A Graphite restack force-pushes every branch in the stack; cancel the stale
# runs instead of queueing them. Never cancel a master run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    needs: [actionlint, tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-just
      # bd gqlc-m5rc: ratchets the set of packages govulncheck cannot see through
      # (in-package tests importing third-party code). It rides the lint job, the
      # root module's always-run static gate, because the vuln job scans only
      # when a go.mod changes — so it never runs on the PRs that add a test file
      # and move this number. Ahead of the lint because it is a `go list` and a
      # `comm`, and there is no point spending a lint on a PR that fails it.
      - run: just vuln-root-residual
      # golangci-lint's per-package analysis cache. Save under a unique key
      # every run, restore by prefix: the same rotation the official action
      # does, without giving up `just lint` as the single entrypoint. The
      # binary itself is not cached: just lint self-provisions it in ~3s,
      # about what a cache restore would cost.
      # Path must match GOLANGCI_LINT_CACHE in the justfile (per-worktree cache
      # colocated under .bin/, see bd gqlc-6rv). Keep in sync.
      - name: golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: .bin/golangci-cache
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.run_id }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
      - run: just lint
      - run: just lint-cache-check

  test:
    needs: [actionlint, tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-just
      - run: just test

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-just
      - run: just tidy-check
      # bd gqlc-v2p: fails when a PR's `.beads/issues.jsonl` drops or reopens
      # an issue vs its base. Fetch only the base commit (depth 1) so cost is
      # O(1) in history size, not O(N). Skip on master push — the tip IS the
      # truth there, nothing to compare against.
      - name: bd export monotonicity vs base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          just bd-export-monotonic "$BASE_SHA"
      # bd gqlc-nyo: require Closes #N in the PR body for beads that have a GH
      # mirror. Reads .beads/issues.jsonl (committed export) — no bd in CI.
      # PASS if: no bead found, bead has no external_ref, bead type is epic.
      # FAIL if: bead has external_ref and body is missing Closes #N or has
      # the wrong number.
      - name: check PR body carries Closes #N for beads with GH mirror
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: |
          bead_id=""
          bead_id=$(printf '%s' "$PR_BODY" | grep -ioP '(?<=Bead: )gqlc-\S+' | head -1 || true)
          if [ -z "$bead_id" ]; then
            bead_id=$(printf '%s' "$BRANCH" | grep -ioP 'gqlc-[a-z0-9.]+' | head -1 || true)
          fi
          python3 .github/scripts/check-pr-closes.py .beads/issues.jsonl "$bead_id"

  codegen-fence:
    needs: [actionlint, tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-just
      - run: just test-codegen-fence

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-just
      - run: just actionlint
