# The always-run merge-blocking checks: lint / test / tidy / actionlint.
# Tool versions are pinned once, in the justfile.
#
# EVERY JOB HERE IS INDEPENDENT, and that is load-bearing rather than tidy.
# lint, test and codegen-fence used to carry `needs: [actionlint, tidy]` so a
# trivial formatting miss cancelled expensive work early. The saving was real
# and it was bought with the merge gate (bd gqlc-yc6x). A job whose `needs:`
# fails does not fail — it concludes SKIPPED, and a required context concluding
# SKIPPED SATISFIES branch protection. Measured first-party on this repo, PR
# #1323 / run 32622299816, 2026-08-23: codegen-fence was forced to conclude
# SKIPPED with the other six required contexts green, and the PR's
# mergeStateStatus read UNSTABLE — the value for "mergeable, some non-required
# check is red" — not BLOCKED. So the gate was open with a required check that
# had never run.
#
# What that costs is not hypothetical: with `needs:` in place, a tidy failure
# printed `skipping` against lint, test and codegen-fence, which reads to a
# human like a pass and left three of the seven required contexts satisfied by
# a job that did nothing. The blocking parent held the gate shut, so no merge
# has been observed to slip through — but the gate then rests entirely on the
# parent's own conclusion never being cleared while the children stay skipped,
# and reruns, cancellations and concurrency all move that.
#
# The trade now runs the other way: a red PR spends runner minutes on jobs that
# were going to be cancelled, and a green PR — the common case — stops waiting
# ~30 s for actionlint and tidy before the slow jobs start. Do not restore the
# `needs:` edges to save the minutes back.
#
# Nothing in this tree refuses a `needs:` here, so today that rule is held by
# this paragraph alone. bd gqlc-zlqv is the guard.
name: ci

# `edited` is here for the check-PR-body gate in the tidy job (bd gqlc-w4al).
# The default type set is [opened, synchronize, reopened], none of which a body
# edit fires, so before this the gate could be passed at open and then have its
# `Closes #N` line edited out: no event, no re-evaluation, merged green with the
# GitHub issue left open. It is also what lets a body fix turn the check green
# without pushing a commit or reopening the PR.
#
# The whole workflow re-runs on a body edit, which is ~3.5 min of runner time
# for what is a one-line check. That is deliberate. Skipping the expensive jobs
# on `edited` with a job-level `if:` would be cheaper and is a bypass: every job
# in a triggered workflow emits a check run, a skipped one is conclusion
# `skipped`, branch protection reads `skipped` as a pass (measured above, not
# assumed: PR #1323 / run 32622299816), and the newest check run for a context
# wins. So a red `lint` on the head SHA would be overwritten
# by a `skipped` one the moment anyone touched the PR description. Same reason
# vuln.yml runs govulncheck on every PR and decides in-job rather than skipping.
# Concurrency keeps the common case cheap anyway: an edit that lands alongside a
# push shares the group and collapses into one run.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]

permissions:
  contents: read

# A Graphite restack force-pushes every branch in the stack; cancel the stale
# runs instead of queueing them. Never cancel a master run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-just
      - uses: ./.github/actions/setup-golangci
      # Ratchets the set of packages govulncheck cannot see through (ADR 0026,
      # bd gqlc-m5rc). It rides the lint job, the root module's always-run static
      # gate, because the vuln job scans only when a go.mod changes — so it would
      # never run on the PRs that add a test file and move this number. Ahead of
      # the lint because it is one `go list`, and there is no point spending a
      # lint on a PR that fails it.
      - run: just vuln-root-residual
      # golangci-lint's per-package analysis cache. Save under a unique key
      # every run, restore by prefix: the same rotation the official action
      # does, without giving up `just lint` as the single entrypoint.
      # Path must match GOLANGCI_LINT_CACHE in the justfile (per-worktree cache
      # colocated under .bin/, see bd gqlc-6rv). Keep in sync.
      #
      # Distinct from the setup-golangci step above, which caches the linter
      # BINARY. That one was uncached on the reasoning that a ~3s self-provision
      # costs about what a restore does — true on time, and beside the point once
      # the download started answering 429 under this repo's own concurrency (bd
      # gqlc-l45j). Two caches, two keys: analysis facts rotate per run, the
      # binary rotates per pinned version.
      - name: golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: .bin/golangci-cache
          key: golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.run_id }}
          restore-keys: |
            golangci-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}-
      # This step is also the repo's ONLY server-side enforcement of gofumpt and
      # gci, and it is not obvious that it is: the formatters have their own
      # recipes (`just fmt`, `just fmt-check`) and their own `formatters:` block
      # in .golangci.yml, and no workflow calls fmt-check. What settles it is
      # that `golangci-lint run` reports the `formatters:` entries as ordinary
      # issues. Measured at the pinned v2.13.1 (bd gqlc-lsku, 2026-08-23),
      # against an rc=0 control on the pristine files:
      #   blank line after a function's opening brace ->
      #     "internal/version/version.go:16:1: File is not properly formatted
      #      (gofumpt)", rc=1
      #   import block reordered ->
      #     "internal/config/count_internal_test.go:4:1: File is not properly
      #      formatted (gci)", rc=1
      # So a clone whose pre-commit hook never ran — or ran during a
      # core.hooksPath drift window (bd gqlc-4thl) — still cannot land
      # unformatted Go. Nothing in the tree holds golangci-lint to that
      # behaviour across a version bump; bd gqlc-sh4j is that gap.
      - run: just lint
      - run: just lint-cache-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-just
      - run: just test

  tidy:
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block outright, so
    # contents: read is restated. pull-requests: read is what lets the
    # check-PR-body step read the live body over the API.
    permissions:
      contents: read
      pull-requests: read
      # The workflow-runs endpoint is under Actions, not Contents. Without this
      # the cron-liveness step below gets a 403 and fails closed, which reddens
      # every PR for a reason that is not a dead cron.
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-just
      - run: just tidy-check
      # bd gqlc-v2p: fails when a PR's `.beads/issues.jsonl` drops or reopens
      # an issue vs its base. Fetch only the base commit (depth 1) so cost is
      # O(1) in history size, not O(N). Skip on master push — the tip IS the
      # truth there, nothing to compare against.
      - name: bd export monotonicity vs base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          just bd-export-monotonic "$BASE_SHA"
      # bd gqlc-nyo: require Closes #N in the PR body for beads that have a GH
      # mirror. Reads .beads/issues.jsonl (committed export) — no bd in CI.
      # PASS if: no bead found, bead has no external_ref, bead type is epic.
      # FAIL if: bead has external_ref and body is missing Closes #N or has
      # the wrong number.
      #
      # The body is fetched from the API rather than taken from
      # github.event.pull_request.body (bd gqlc-w4al). The payload body is
      # frozen at trigger time, and the newest check run for a context is the
      # one branch protection reads — so with a payload read, stripping
      # `Closes #N` and then re-running the run that opened the PR would land a
      # fresh green verdict over a body that no longer carries the line. The
      # `edited` trigger is what makes anything run when the body changes; this
      # fetch is what makes a re-run of any older run honest. Neither alone
      # closes the hole.
      #
      # Bead-id extraction moved into the checker with it. It used to be
      # `grep ... | head -1 || true` here, and a pipeline reports the status of
      # its last command: a grep that failed outright was indistinguishable
      # from "no bead on this PR", which passes.
      # Quoted: unquoted, YAML reads ` #N for beads with GH mirror` as a comment
      # and the step's name in the Actions UI is "check PR body carries Closes".
      - name: "check PR body carries Closes #N for beads with GH mirror"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # Not piped and not `|| true`: under bash -e a fetch that fails
          # aborts the step. An empty body file would read as "no Closes
          # present", so a silently-failed fetch must not reach the checker.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' \
              > "${RUNNER_TEMP}/pr-body.txt"
          python3 .github/scripts/check-pr-closes.py \
              .beads/issues.jsonl "${RUNNER_TEMP}/pr-body.txt" "$BRANCH"
      # bd gqlc-gy3q: the SERVER-SIDE half of the identity rules in
      # .githooks/commit-msg. That hook is advisory — --no-verify skips it, a
      # clone that never ran `just init` never had it, and core.hooksPath has
      # been observed rewritten to /dev/null in the SHARED config by
      # worktree-isolated agent spawns with no tripwire (bd gqlc-r41). Here the
      # configuration is not the developer's.
      #
      # PR-scoped, not master-scoped, because this repo squash-merges: the
      # squash commit is authored by whoever merged and committed by GitHub, so
      # the identities the work was written under are readable only up to the
      # merge.
      #
      # `--jq '.[]'` is applied per page, so --paginate yields NDJSON rather
      # than a nest of arrays. GitHub caps this endpoint at 250 commits; a PR
      # longer than that is unreviewable for other reasons long before this
      # gate is the problem.
      #
      # The rules themselves are NOT restated in the checker — it sources
      # .githooks/implausible-identity.sh, the same file the hook reads.
      - name: "PR commits carry a plausible author and no AI-attribution trailer"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Not piped and not `|| true`: a silently-failed fetch would leave an
          # empty file, and an empty file must not read as "no bad commits".
          # The checker fails closed on one anyway; this is the outer half.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
              --jq '.[]' > "${RUNNER_TEMP}/pr-commits.ndjson"
          .github/scripts/check-pr-authors.sh "${RUNNER_TEMP}/pr-commits.ndjson"
      # bd gqlc-89vw: a bead label over 50 characters cannot be mirrored to a
      # GitHub issue, and .githooks/bd-gh-sync only WARNS when the API refuses
      # it — the bead is created, the board looks healthy, and the only casualty
      # is the bd<->GH mirror the town uses for review and closing. Runs on
      # master pushes too: the export is the input, and it is equally wrong
      # there.
      - name: "bead labels fit GitHub's 50-character cap"
        run: python3 .github/scripts/check-label-lengths.py .beads/issues.jsonl
      # bd gqlc-zqa3: GitHub disables cron-triggered workflows repo-wide after
      # 60 days of no repository activity, and a nightly that stops firing is
      # indistinguishable from a nightly that passes — there is no red check,
      # there is nothing. codegen-live.yml's nightly-alert job covers a
      # scheduled run that FAILS; it cannot cover one that never happens.
      #
      # A pull_request trigger is the one a disablement leaves alive, so this is
      # the only place the observation can be made. codegen-live.yml is the
      # daily cron, so it goes stale first; vuln.yml's weekly sweep dies in the
      # same event and needs no second check.
      #
      # It BLOCKS. The threshold is 14 days against a daily cron, which is long
      # enough that no transient this repository has seen can reach it, and the
      # remedy is one command named in the failure. The argument for blocking
      # rather than warning is written out at the top of the script.
      - name: "the nightly cron is still firing"
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-cron-freshness.sh codegen-live.yml 14
      # shellcheck over .github/scripts. `just lint-hooks` defaults to
      # .githooks and so has never looked at this directory; the recipe takes
      # the directory as an argument precisely so it can. It fails rather than
      # skips when a file carries no shebang it recognises, so a script added
      # here tomorrow is either linted or loud.
      - run: just lint-hooks .github/scripts

  codegen-fence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-just
      # test-codegen-fence depends on ensure-golangci, so this job downloads the
      # linter too — it is where the 429 in bd gqlc-l45j's first witness landed.
      - uses: ./.github/actions/setup-golangci
      - run: just test-codegen-fence

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-just
      - run: just actionlint
