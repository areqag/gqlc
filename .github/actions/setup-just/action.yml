# Installs the pinned just binary; every job runs its checks through just
# recipes, so this is the one installer every workflow shares.
name: setup-just
description: install the pinned just binary and add it to PATH
runs:
  using: composite
  steps:
    - name: restore just from cache
      id: cache-just
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/just
        key: just-1.55.1-${{ runner.os }}

    - name: install just
      if: steps.cache-just.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.local/bin"
        curl --proto '=https' --tlsv1.2 -sSfL \
          --retry 5 --retry-all-errors --retry-delay 2 \
          https://just.systems/install.sh \
          | bash -s -- --tag 1.55.1 --to "$HOME/.local/bin"

    - name: add just to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
