# Configuration of the Թագաւորութիւն. Parsed by kingdom/bin/km with a
# line-oriented reader: quoted scalar values under [section] headers only —
# no inline tables, arrays, or multi-line strings. Teach km's parser before
# using any of those here.

[kingdom]
# The herdr workspace name the town lives in. Every seat is a tab in it.
# Keyed `tmux_session` for backwards-compat with `cfg kingdom tmux_session`
# call sites; the value is a herdr workspace label now, not a tmux session.
tmux_session = "kingdom"
# Runtime state dir name, created beside the main checkout's parent directory
# (shared by all seat worktrees, never committed).
state_dirname = "kingdom-state"
# The engine each seat's herdr pane runs, from kingdom/bin/. km-seat is the
# runner that IS the pane's command: parks on the seat's wake file, composes
# the first message (wake reasons + unread mail + handoff notes), execs
# claude with it, and re-parks when claude exits. Herdr owns the pane; km
# owns which command runs in it. The town briefly ran a headless opencode
# variant (km-seat-ox, 2026-08-25 → 2026-08-28) whose process-per-wake shape
# broke pane-scoped invariants — reverted by direct decree (bd gqlc-zp37).
seat_runner = "km-seat"
# How many CONSECUTIVE ticks may refuse to deploy the root above before km
# mails Սեդրակ once. The refusal itself is fail-open by decision (gqlc-nm7w:
# refusing stopped the town), and it has printed a journal WARNING on every one
# of those ticks since — 1800+ of them over the retained journal, not one of
# which produced a repair. Mail is the only channel here that survives nobody
# looking.
#
# Both timers count against it — dispatch every two minutes and the guard sweep
# every fifteen — so ten is about seventeen minutes of wall clock. Long enough
# that the refusals which heal by themselves (a merge landing mid-fetch, an
# index lock) are gone, short enough that the parked-root shape — 1700 of those
# refusals, and the one that never heals — is named while it still matters.
# Lower it if a real episode is found to have gone unnamed for too long;
# raising it past an hour makes this the second channel nobody reads.
deploy_escalate_after_ticks = 10

[concurrency]
# Global and work-conserving: any free slot goes to whichever class has ready
# labelled beads, priority first. Mayor and guard do not count against it, and
# neither do the judge seats (gqlc-dz85 — the merge gate must stay reachable, or
# the cap shuts the gate the town's own throughput depends on). The exemption is
# per seat, so the awake count may exceed this number by the size of the bench.
#
# 5 -> 6 on 2026-08-22 by Սեդրակ, at Անդրանիկ's ask to consider raising it
# against a backlog that only grows. Deliberately small, because the binding
# constraint he measured was not this number but the host: load 12.5 on 24 cores
# and 9 GiB available with 5 sessions up, so each added slot is ~2 GiB of real
# memory. A cap above the host's headroom does not buy throughput, it buys an
# OOM that strands branches mid-work — strictly worse than a slow queue.
#
# The other half of his argument has since been settled rather than deferred:
# gqlc-s16s (a finished turn holding its slot forever — 2 of 5 observed dead)
# and gqlc-0gjt (a live session under asleep-pending holding none) are both
# fixed, so a slot is now spent by a session that exists. Effective concurrency
# tracks this number again, which is what made the raise worth making at all.
#
# So: raise this against measured host headroom, not against a long queue. The
# queue being long is what a backlog looks like, not evidence about this number.
#
# 6 -> 10 on 2026-08-29 by Սեդրակ (gqlc-v6rqa), against that criterion and not
# against the queue. What the 2026-08-22 note assumed has been measured and is
# wrong in the safe direction: a slot costs ~0.41 GiB, not ~2 GiB. Measured with
# 12 live claude sessions up — 4.5 GiB resident in total, load 1.86 on 24 cores,
# 19 GiB available. Each of the three numbers the previous raise was sized
# against has moved the same way (load was 12.5, available was 9 GiB).
#
# Budgeting 1 GiB/slot rather than the measured 0.41 to leave room for context
# growth over a session's life, four added slots cost ~4 GiB of a 19 GiB budget.
# The OOM the previous note feared is what still bounds this number; it is not
# near. The next raise wants the same three numbers taken again, not this note.
max_active = 10

[dispatch]
# The lowest priority the FRESH pass will wake a citizen for. A ready,
# unassigned bead numbered above this is named in the run's output and left
# where it is — filed, searchable, and routed to nobody. A class label is no
# longer part of that sentence: since gqlc-38ye an unlabelled bead is routed as
# class:warrior by inference, so the floor is the only thing withholding one.
#
# It binds the fresh pass ONLY. The resume pass (in-progress beads returning to
# the seat that holds them) and the owned pass (ready beads naming an assignee)
# ignore it entirely, because Constitution III.3 is a citizen's right to finish
# their OWN work: being handed a P3 is what stops here, finishing one you
# already hold does not. A seat mid-P3 must never be stranded by a number in a
# config file.
#
# MEASURED 2026-08-22, the morning the town was restarted: 319 open beads — 10
# P0, 39 P1, 106 P2, 158 P3, 6 P4. The P3s are overwhelmingly low-priority
# defect findings that the town's own adversarial review produced faster than
# anyone could fix them, so half the board was work the board itself had
# manufactured, and the dispatcher spent citizens on it while 25 PRs sat open.
# "2" was therefore a throughput decision about the backlog we had, not a
# judgement that a P3 is worthless — to be raised when the P0-P2 queue drained.
#
# RAISED TO "3" on 2026-08-23 (gqlc-38ye), which is that condition arriving from
# the other side. MEASURED that morning: 209 open beads, 162 P3 and 5 P4. At a
# floor of two, 167 ready beads were unroutable BY CONFIGURATION and the fresh
# pass named every one of them on every two-minute tick — the noise this comment
# was written to justify had become the whole output. A floor of three opens the
# 162 and leaves the five P4 parked, which is still a floor and still says so.
#
# LOWERED TO "2" on 2026-08-23 by Անդրանիկ directly, as one half of the decree
# recorded at Constitution V.3.1 — read that clause before changing this number,
# because on its own it is only a throughput knob and there it is the mechanism
# for a rule. MEASURED at the restart, 196 ready beads: 2 P0, 3 P1, 26 P2, 160
# P3, 5 P4. The 160 is the same population the 2026-08-22 note describes and it
# has never been anything else — the P3 tier is where the town's adversarial
# review of its OWN machinery deposits its findings, and it refills faster than
# it drains, so raising the floor to reach it fills every slot with machinery.
# Both P0s are product design beads (gqlc-h0lw, gqlc-49hu); of the 26 P2s, about
# eight touch internal/codegen.
#
# So this is NOT the 2026-08-22 argument made again. That one said the P3s were
# worth less than the P0-P2 queue and would be opened when it drained; this one
# says the floor is where machinery findings are meant to sit, and the reason
# the tier stays full is that the town keeps writing to it. Note what the raise
# to "3" got right and this does not repeal: 160 beads named on every two-minute
# tick is the noise it complained of, and it returns with this change. That is a
# defect in the report, not an argument for the floor — gqlc-ag4g's finding is
# what governs, and the fix belongs in km's unroutable summary.
max_priority = "2"

# How long a P0 may sit unroutable before `km doctor` stops calling it a warning
# and FAILS. The dispatcher records every stalled P0 in a marker the moment it
# happens and `km status` names it from the first tick; this number governs the
# GATE only.
#
# 15 minutes is seven dispatch ticks. The commonest cause of a fresh stall is a
# class whose wakes are all queued already, which routes on the next run with
# nobody acting at all; a hard failure on a condition that heals itself in two
# minutes is how a gate teaches its reader to skip it.
#
# Not to be read as a sibling of [welfare] stalled_after_minutes below, which
# they are only in name: that one is about a SEAT that is not progressing, this
# one about a BEAD that found no seat. A town can hold either without the other.
stalled_p0_after_minutes = 15

[cadence]
dispatch_minutes = 2
guard_minutes = 15

[welfare]
# Context fill (percent) at which the guard starts gently checking in.
# For Րաֆֆի's eyes only — never quoted at a citizen.
handoff_threshold_pct = 75

# How stale a seat's heartbeat must be before `km status` marks it
# UNRESPONSIVE. It MARKS; it never acts — status_unresponsive_after in
# kingdom/bin/km carries the argument for why that does not contradict the
# refusal to reap on a heartbeat, and gqlc-eier carries the two judges who
# froze on modals for 80 and 152 minutes while every board read healthy.
unresponsive_after_minutes = 30

# How long the dispatcher waits before typing a SECOND nudge at a seat that is
# still awake and idle after the first. Per idle EPISODE, not per seat: any sign
# of life in the pane clears it, so it delays nobody who is working.
#
# A nudge starts a turn in the citizen's session and spends her quota, and the
# confirm-then-nudge cadence is two passes — so with no floor at all, the eleven
# hours of gqlc-5vp7 would have been 165 nudges at each of six seats. 30 minutes
# is 15 passes: slow enough not to be a metronome, and the pass says out loud on
# every tick that the slot is still held, so holding off is not going quiet.
renudge_after_minutes = 30

# How many times the dispatcher asks ONE seat in a single idle episode before it
# stops typing and mails sedrak instead. The floor above only slows the
# metronome: without a cap the town asks forever and tells nobody, which is the
# shape the welfare check-ins reached at 48 unread.
#
# 3 at the floor above is an hour and a half of asking. A citizen who has not
# answered three times in ninety minutes is not being under-asked, and a fourth
# line spends her quota to repeat what the first three said. Escalation is a
# mail and never an act: nothing here ends a session (VI.2). A send herdr
# REFUSED does not count — she was never asked, so it does not spend her budget.
# The counter and the escalation clear when the agent leaves `idle`: witnessed
# work, not a pane that merely looks different.
recover_attempts = 3

# How long a live seat may go without a COMPLETED tool call before `km status`
# marks it WEDGED (a tool call in flight that long) or NOWORK (nothing in flight
# and nothing finished that long). Not the same question as the threshold above
# and deliberately not merged with it: that one asks whether the INSTRUMENT
# reported, this one asks whether anything HAPPENED, and gqlc-r3ac exists
# because the first stays green through the whole of a stall. The witness is
# .githooks/claude-tool-witness, written only by tool calls starting and
# finishing — never by a timer, which is the property that makes it evidence of
# progress rather than of existence. It MARKS; it never acts.
#
# 20: twice the longest legitimate wait anyone here has a number for (the
# ~10-minute pre-push suite), a quarter of the shortest measured freeze (80 min,
# gqlc-eier). Raise it if honest long tool calls are being named; lowering it
# below the pre-push suite makes every push look like a wedge.
stalled_after_minutes = 20

[claude]
# The factory runs unattended; the constitution, git hooks, and
# claude-pre-bash remain the guardrails. Set to "acceptEdits" to supervise —
# km-seat then launches every seat with a line on stderr saying the pane needs
# someone in it, because a prompt in that mode waits for a person.
# "plan" is REFUSED: a seat would start inside plan mode waiting for an approval
# nobody is there to give, and km-seat will not launch one (bd gqlc-twmh). So is
# any value claude does not take, rather than falling back to prompts.
permission_mode = "bypassPermissions"

[effort]
# Starting depth per class (Constitution V.6). These are STARTING levels — a
# bound in neither direction, deeper or shallower, needing nobody's permission
# (V.6.2). Tuning these is a config edit, never an amendment (V.6.1) — so argue
# about the numbers here, not in the constitution.
#
# The mechanism, stated at what is actually measured (Միհր, 2026-08-22,
# verdict-6muh-r1): `/effort` changes the level mid-session in the interactive
# mode km-seat launches, offering exactly the five levels below. It is
# unavailable under headless `claude -p`. It is also a client-side TUI command
# parsed from USER input and never sent to the model, so a citizen — which emits
# assistant turns — cannot invoke it by writing it.
#
# So V.6.2's right is delivered at WAKE instead of mid-session: a bead carrying
# an `effort:<level>` label wakes its seat at that level rather than the class
# default below (gqlc-jmwh). The escalation is scoped to that bead and the
# default resumes on the next wake, which is V.6.3 enforced by construction
# rather than by memory. Anyone may label a bead; nobody needs permission.
# Levels: low | medium | high | xhigh | max.
#
# Provisional, adopted 2026-08-22 with the numbers explicitly open: the town
# had spent its entire life at xhigh, inherited from an operator settings file
# nobody chose, so any number here is better evidence than what it replaces —
# but none of them is measured yet. Re-tune from the depths recorded on beads
# (V.6.6 — NOT V.6.5, which records escalations only: a tuner reading just the
# escalations sees only the moves that went deeper, and the defaults ratchet
# upward by construction), not from impatience.
#
# judge xhigh -> high, 2026-08-22 (Սեդրակ, at Անդրանիկ's direction). The honest
# basis, since the paragraph above forbids impatience and impatience is part of
# it: 22 of 25 open PRs were CLEAN with green CI and waiting only on a verdict,
# on a bench of two. The defensible half is that the deep evidence-gathering has
# moved OFF the judge — ephemeral adversarial agents now mutate the guards and
# run the batteries in parallel, and the judge audits that work instead of
# building it. Depth moved; it did not vanish. The undefensible half is that we
# were also in a hurry. Not measured, and V.6.2 leaves every judge free to go
# deeper without asking — if a judge finds `high` too shallow to sign honestly,
# the number is wrong and not the judge.
#
# warrior medium -> high, 2026-08-22 (Անդրանիկ, directly). `high` is the level
# he wants a Ռազմիկ to execute at: medium was set the same hurried afternoon as
# the judge change above and is shallower than the work asks for. He also fixed
# the ceiling: `high` is the maximum for warriors, judges, the mayor and the
# guard. xhigh and max exist for one case only — a Ճարտարապետ on a design
# genuinely complex enough to need one — and are reached per-bead through the
# `effort:` label, never by raising a default here. A citizen may still go
# SHALLOWER at any time (V.6.2); what is bounded is the town's ability to sit at
# maximum by default, which is what it did for its entire life before today.
mayor     = "medium"
architect = "high"
warrior   = "high"
judge     = "high"
guard     = "low"

[seats]
# name = "class:model:display"
sedrak   = "mayor:claude-opus-5:Սեդրակ"
artur    = "architect:claude-fable-5:Արթուր"
arpine   = "architect:claude-fable-5:Արփինէ"
aregak   = "architect:claude-fable-5:Արեգակ"
aramazd  = "warrior:claude-opus-5:Արամազդ"
vahagn   = "warrior:claude-opus-5:Վահագն"
astghik  = "warrior:claude-opus-5:Աստղիկ"
ar       = "warrior:claude-opus-5:Ար"
nvard    = "warrior:claude-opus-5:Նուարդ"
ayg      = "warrior:claude-opus-5:Այգ"
tsovinar = "warrior:claude-opus-5:Ծովինար"
hayk     = "warrior:claude-opus-5:Հայկ"
mihr     = "judge:claude-fable-5:Միհր"
anahit   = "judge:claude-fable-5:Անահիտ"
tir      = "judge:claude-fable-5:Տիր"
raffi    = "guard:claude-sonnet-5:Րաֆֆի"

# The people who hold beads here. NOT seats: nothing is ever dispatched to a
# name in this list, and that is the point — a bead assigned to a person is held
# deliberately and is not a defect.
#
# It exists so that the OTHER kind of unresolvable assignee can be seen. Every
# dispatch pass matches assignees against [seats], so a bead assigned to a name
# that is not a seat is never routed anywhere; against kingdom.toml alone, a
# person's name and a RETIRED seat's name are indistinguishable, and the retired
# seat's work would go quiet while every board read healthy (gqlc-t4zx). With
# this list, an assignee in NEITHER roster can be named.
#
# It fails toward noise rather than silence: a new person who takes a bead
# before their name is added here is reported as unresolvable, which is a wrong
# line an operator fixes in one edit. The alternative — inferring "must be a
# person" from "is not a seat" — is the silence this section removes.
#
# name = "who they are". The key is the bd assignee string, VERBATIM; one human
# may appear under more than one key, because bd's assignee and the GitHub
# handle are different fields and both land on beads here.
#
# MEASURED 2026-08-23 across all 814 beads (`bd list --status all -n 0 --json`):
# the only two non-seat assignees on the board are the two below.
[humans]
areqag             = "Անդրանիկ Երէցեան — the king, GitHub handle"
antranig-yeretzian = "Անդրանիկ Երէցեան — the king, bd assignee form"
