# Configuration of the Թագաւորութիւն. Parsed by kingdom/bin/km with a
# line-oriented reader: quoted scalar values under [section] headers only —
# no inline tables, arrays, or multi-line strings. Teach km's parser before
# using any of those here.

[kingdom]
tmux_session = "kingdom"
# Runtime state dir name, created beside the main checkout's parent directory
# (shared by all seat worktrees, never committed).
state_dirname = "kingdom-state"

[concurrency]
# Global and work-conserving: any free slot goes to whichever class has ready
# labelled beads, priority first. Mayor and guard do not count against it, and
# neither do the judge seats (gqlc-dz85 — the merge gate must stay reachable, or
# the cap shuts the gate the town's own throughput depends on). The exemption is
# per seat, so the awake count may exceed this number by the size of the bench.
#
# 5 -> 6 on 2026-08-22 by Սեդրակ, at Անդրանիկ's ask to consider raising it
# against a backlog that only grows. Deliberately small, because the binding
# constraint he measured was not this number but the host: load 12.5 on 24 cores
# and 9 GiB available with 5 sessions up, so each added slot is ~2 GiB of real
# memory. A cap above the host's headroom does not buy throughput, it buys an
# OOM that strands branches mid-work — strictly worse than a slow queue.
#
# The other half of his argument has since been settled rather than deferred:
# gqlc-s16s (a finished turn holding its slot forever — 2 of 5 observed dead)
# and gqlc-0gjt (a live session under asleep-pending holding none) are both
# fixed, so a slot is now spent by a session that exists. Effective concurrency
# tracks this number again, which is what made the raise worth making at all.
#
# So: raise this against measured host headroom, not against a long queue. The
# queue being long is what a backlog looks like, not evidence about this number.
max_active = 6

[cadence]
dispatch_minutes = 2
guard_minutes = 15

[welfare]
# Context fill (percent) at which the guard starts gently checking in.
# For Րաֆֆի's eyes only — never quoted at a citizen.
handoff_threshold_pct = 75

[claude]
# The factory runs unattended; the constitution, git hooks, and
# claude-pre-bash remain the guardrails. Set to "acceptEdits" to supervise.
permission_mode = "bypassPermissions"

[effort]
# Starting depth per class (Constitution V.6). These are STARTING levels — a
# bound in neither direction, deeper or shallower, needing nobody's permission
# (V.6.2). Tuning these is a config edit, never an amendment (V.6.1) — so argue
# about the numbers here, not in the constitution.
#
# The mechanism, stated at what is actually measured (Միհր, 2026-08-22,
# verdict-6muh-r1): `/effort` changes the level mid-session in the interactive
# mode km-seat:83 launches, offering exactly the five levels below. It is
# unavailable under headless `claude -p`. It is also a client-side TUI command
# parsed from USER input and never sent to the model, so a citizen — which emits
# assistant turns — cannot invoke it by writing it. V.6.2's right therefore needs
# a deliverer, and which one is still open (gqlc-jmwh, not gqlc-w6tl: that bead
# is the launch flag, and closes with it).
# Levels: low | medium | high | xhigh | max.
#
# Provisional, adopted 2026-08-22 with the numbers explicitly open: the town
# had spent its entire life at xhigh, inherited from an operator settings file
# nobody chose, so any number here is better evidence than what it replaces —
# but none of them is measured yet. Re-tune from the depths recorded on beads
# (V.6.6 — NOT V.6.5, which records escalations only: a tuner reading just the
# escalations sees only the moves that went deeper, and the defaults ratchet
# upward by construction), not from impatience.
#
# judge xhigh -> high, 2026-08-22 (Սեդրակ, at Անդրանիկ's direction). The honest
# basis, since the paragraph above forbids impatience and impatience is part of
# it: 22 of 25 open PRs were CLEAN with green CI and waiting only on a verdict,
# on a bench of two. The defensible half is that the deep evidence-gathering has
# moved OFF the judge — ephemeral adversarial agents now mutate the guards and
# run the batteries in parallel, and the judge audits that work instead of
# building it. Depth moved; it did not vanish. The undefensible half is that we
# were also in a hurry. Not measured, and V.6.2 leaves every judge free to go
# deeper without asking — if a judge finds `high` too shallow to sign honestly,
# the number is wrong and not the judge.
mayor     = "medium"
architect = "high"
warrior   = "medium"
judge     = "high"
guard     = "low"

