aregak   = "architect:claude-fable-5:Արեգակ"
aramazd  = "warrior:claude-opus-5:Արամազդ"
vahagn   = "warrior:claude-opus-5:Վահագն"
astghik  = "warrior:claude-opus-5:Աստղիկ"
ar       = "warrior:claude-opus-5:Ար"
nvard    = "warrior:claude-opus-5:Նուարդ"
