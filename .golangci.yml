version: "2"

run:
  # Files behind //go:build codegen_live are outside the default build
  # configuration, so without this the linter never loads them and reports
  # success on code it has not read. The tag lives here so every entry point
  # that loads packages — `just lint`, `just lint-new`, the hooks, the nested
  # module's fence — agrees on which files exist. `just fmt` is unaffected:
  # golangci-lint fmt works per file and never needed the tag.
  build-tags:
    - codegen_live
    # test/data/tagblind is `just vuln`'s tag-derivation fixture: a directory
    # whose every Go file is constrained, which is the shape `go list ./...`
    # cannot see. Without the tag here the linter cannot see it either, and the
    # one directory in this tree that no default-configuration tool loads would
    # also be the one nothing checks.
    - tagblind

linters:
  default: none
  enable:
    # correctness
    - staticcheck
    - govet
    - errcheck
    - errorlint
    - nilerr
    - copyloopvar
    - ineffassign
    - wastedassign
    - unconvert
    - unparam
    - unused
    - predeclared
    - gocritic
    - noctx
    - contextcheck
    # codebase-specific invariants
    - exhaustive
    - depguard
    - musttag
    - forbidigo
    - ireturn
    # function complexity — both, deliberately; see the settings below
    - gocyclo
    - gocognit
    # tests
    - testifylint
    - thelper
    # hygiene
    - misspell
    - nolintlint
    - revive
  settings:
    depguard:
      rules:
        # ADR 0003: the curated query model is dialect-agnostic — nothing from
        # the grammar layer may leak above the parser boundary.
        query-model-dialect-agnostic:
          files:
            - "**/internal/query/*.go"
          deny:
            - pkg: github.com/areqag/gqlc/internal/grammar
              desc: the query model is dialect-agnostic (ADR 0003); grammar types stay inside the parser packages
            - pkg: github.com/antlr4-go/antlr
              desc: the ANTLR runtime must not leak into the query model (ADR 0003)
        # Generated grammar packages are an implementation detail of exactly
        # two consumers: the Cypher query parser and the GQL schema parser.
        grammar-isolation:
          files:
            - $all
            - "!**/internal/query/cypher/**"
            - "!**/internal/schema/gql/**"
            - "!**/internal/grammar/**"
          deny:
            - pkg: github.com/areqag/gqlc/internal/grammar
              desc: grammar packages are importable only by internal/query/cypher and internal/schema/gql
            - pkg: github.com/antlr4-go/antlr
              desc: the ANTLR runtime is importable only by the parser packages
    errcheck:
      # the default mode lets `_ = f()` discard errors silently; strict mode
      # makes every discard a visible, justified decision
      check-blank: true
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: route output through cmd.OutOrStdout()/cmd.ErrOrStderr(); direct printing bypasses the command writers
        - pattern: ^log\.(Print|Fatal|Panic)
          msg: route output through cmd.OutOrStdout()/cmd.ErrOrStderr(), not the legacy log package
    # Two counters, because on this tree they disagree by 3x and each is blind
    # where the other sees. gocyclo increments once per `case`, so a flat
    # constant->text dispatch table scores as if it were deeply nested;
    # gocognit charges a `switch` once regardless of arm count and charges for
    # nesting depth instead. Measured 2026-09-10 over 734 non-test functions:
    #
    #   function                                          cyclo  cognit
    #   internal/codegen/neo4j/types.go  (typeMap).Property   31      10
    #   internal/codegen/age/types.go    (typeMap).Property   33      15
    #   internal/resolver/resolve.go     resolveType          21       6
    #   internal/resolver/scope.go       DemoteNullability    43      90
    #
    # The first three are flat tables. gocyclo ranked neo4j's the 6th-worst
    # function in the repository when it is one `switch` with no nesting at
    # all, and the only way to satisfy a gocyclo-only gate there is to shatter
    # a readable table — which `exhaustive` then stops holding to the full
    # constant set. The fourth is the genuinely hard function, and gocyclo
    # ranked it only 1.4x above a lookup table. Either counter alone points
    # refactoring effort at the wrong functions; together they do not.
    #
    # A linter fires STRICTLY ABOVE its min-complexity, so these admit 25 and
    # 35 and refuse 26 and 36. Both numbers are the measured ceiling of the
    # tree after gqlc-oudt paid down the 13 functions that stood above them —
    # they are a ratchet position, not a comfort margin, and gqlc-5sfv tracks
    # lowering them. Raising either to land a change is the wrong direction:
    # extract a helper instead.
    gocyclo:
      min-complexity: 25
    gocognit:
      min-complexity: 35
    ireturn:
      # return structs, not interfaces — with two deliberate exceptions: the
      # marker-sealed sums of the query model (Binding, Endpoint, Projection,
      # Type, Use), the resolver's ResolvedType and the corpus harness' ebnf are
      # either/or types; there is no concrete type to return; and the Parser
      # factories (returning the unexported struct would trip
      # unexported-return).
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - github.com/areqag/gqlc/internal/query\.(Parser|Binding|Endpoint|Projection|Type|Use)$
        - github.com/areqag/gqlc/internal/queryfile\.Parser$
        - github.com/areqag/gqlc/internal/resolver\.ResolvedType$
        - github.com/areqag/gqlc/internal/schema\.Parser$
        # `_test` suffix: the corpus harness lives in the external test package,
        # which is what it has to be to stay inside govulncheck's call graph
        # (ADR 0026, bd gqlc-m5rc).
        - github.com/areqag/gqlc/internal/schema/gql_test\.ebnf$
        # ANTLR's Go target generates every grammar-rule context as an
        # interface, so tree-walking helpers have no concrete type to return.
        # depguard already restricts who may import these packages at all.
        - github.com/areqag/gqlc/internal/grammar/
        - github.com/antlr4-go/antlr/
        # The live battery's seam: a scenario body is written once and runs
        # against every backend arm, so an arm, the isolated view it hands a
        # scenario, and the generated handles bound to that view are each
        # reachable only as the interface the body is written against. Listed
        # per type, so ireturn keeps full strength on the rest of that module.
        # The `_test` suffix is the package path of an external test package,
        # which is what the battery has to be to stay inside govulncheck's call
        # graph (ADR 0026) — not a typo.
        - github.com/areqag/gqlc/test/data/codegen_test\.(harness|backend|writeBackend|edgeUnionBackend|temporalBackend|zonedTimeBackend|savepointBackend|localDateTimeColumnBackend|mapColumnBackend|oneColOneParamOneQuerier|manyColManyQuerier|nestedListQuerier|nullListElemQuerier|nullOuterElemQuerier|deepNestedListQuerier|mixedReadWriteBatchQuerier|entityNodeQuerier|entityEdgeQuerier|edgeUnionQuerier|anyValueColumnQuerier|timestampRoundtripQuerier|temporalRoundtripQuerier|zonedTimeRoundtripQuerier|localDateTimeColumnQuerier|mapColumnQuerier|txQuerier|liveTx)$
    misspell:
      # the codebase is written in British English (see CONTEXT.md: canonicalised,
      # modelled, serialise); UK locale enforces that consistently
      locale: UK
      # `synchronize` is the spelling GitHub gives one of its pull_request
      # activity types. It is an API token that .github/workflows/ci.yml has to
      # write exactly, so anything asserting against that list carries the
      # American spelling as a literal and cannot be corrected.
      ignore-rules:
        - synchronize
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      # the golint-heritage default set, explicit so `exported` can be configured
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    paths:
      - internal/grammar/cypher/gen
      - internal/grammar/gql/gen
    rules:
      # (Enter|Exit)OC_* implement the ANTLR-generated Cypher listener interface;
      # the underscored names are fixed by the generated code and cannot change
      - path: internal/query/cypher/
        text: "method (Enter|Exit)OC_"
        linters:
          - revive
      # Complexity is gated on production code only. What the counters find in
      # _test.go here is table-driven assertion harnesses, where the branching
      # is per-case data rather than control flow a reader has to hold: of the
      # 1905 functions measured on 2026-09-10, the worst test offender was
      # assertReferentialIntegrity at cyclo 42 — one `case` per invariant it
      # checks. Splitting those to satisfy a counter makes the failure harder
      # to localise, which is the opposite of what a test is for.
      #
      # This is the loosest part of the gate and the part most likely to be
      # wrong. It is an exemption for TEST HARNESSES, not a licence for
      # unreadable tests; if a test grows genuinely nested logic, that logic
      # wants to be a helper under test in its own right.
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
  exclusions:
    paths:
      - internal/grammar/cypher/gen
      - internal/grammar/gql/gen
