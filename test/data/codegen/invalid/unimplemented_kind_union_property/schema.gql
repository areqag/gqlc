// Every enrolled target, and that is the fixture's point rather than an
// over-enrolment. The other refusals in this corpus are a backend's
// answer — a width one type table has no carrier for, a value one
// server will not store — so they enrol the targets that give it. This
// one is gqlc's own: the schema front end resolves a closed dynamic
// union to a property type carrying its members and no backend has an
// emission for the kind, so a target that admitted it would be the
// surprise. Dropping a target here is how that stops being measured.
//
// It carried a RECORD until stage 1 of gqlc-x9tg7, which gave records an
// emission on both backends and so took this sentinel's last fixture
// away from it. A union is what remains of the kinds gqlc refuses at
// their own node, and it is the kind the walk's new record descent
// exists for: without that descent a union nested inside a record
// reaches the type table instead and comes back a width error.
//
// The nested and list-borne spellings are unit-level, in
// TestUnimplementedKindRefusedBeforeTheCarrierQuestion. What this file
// carries is the reach: the plainest schema an author can write that
// lands on the sentinel, through a real parse rather than an assembled
// Input.
CREATE PROPERTY GRAPH TYPE UnimplementedKindUnionProperty AS {
    (:Row {
        u :: ANY<INT32 | STRING>
    })
}
