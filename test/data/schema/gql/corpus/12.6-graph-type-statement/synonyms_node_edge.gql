-- nodeSynonym#1 (NODE) and edgeSynonym#1 (EDGE), the counterpart to synonyms.gql's
-- VERTEX and RELATIONSHIP. The productions themselves (nodeTypePattern, GQL.g4:1507)
-- have been covered all along by synonyms.gql's VERTEX spelling; what this file adds
-- is the alternative each synonym rule takes.
CREATE GRAPH TYPE Seed {
    NODE A (a:A),
    NODE B (b:B),
    DIRECTED EDGE R (a)-[:R]->(b)
}
