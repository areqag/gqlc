-- The bare-bar closed dynamic union: `STRING | INT` with no ANY VALUE<...>
-- around it. It is the only file in the corpus where valueType alternative 10 is
-- the property's OUTERMOST type, which is what it is here to be.
--
-- constructed_dyn_closed_union.gql is `ANY VALUE<STRING | INT>` and nests an Atl2
-- inside an Atl1, so it carries the alternative too. That was not enough while
-- the family was declined: declineValueType read the outermost context and did
-- not descend, so deleting its Atl2 arm left the suite green and the spelling
-- rejected on the bare ErrUnsupportedType instead. gqlc-h9n.33 resolves both
-- alternatives and does descend, so the arm is exercised from either file now;
-- the file stays because the outermost position is a distinct dispatch and
-- nothing else takes it.
CREATE PROPERTY GRAPH TYPE Seed AS {
    (:Bag { p :: STRING | INT })
}
