-- fieldTypesSpecification with its `fieldTypeList?` elided (GQL.g4:1988): the empty
-- record `RECORD {}`. The braces are written and declare no fields.
--
-- It resolves to RECORD<>, which is a DIFFERENT type from the braceless RECORD in
-- constructed_record_bare.gql: `RECORD` says the fields are undeclared and
-- `RECORD {}` says there are none, and an encoding collapsing them would let a
-- schema promising nothing unify with one promising anything.
--
-- It is also the shape ANTLR's accessors lie about. FieldTypeList() is nil here
-- rather than an empty list, so an implementation trusting a non-nil parent
-- accessor walks nothing. gqlc-h9n.33 lifted the decline this file used to pin;
-- ADR 0039 has the encoding.
CREATE PROPERTY GRAPH TYPE Seed AS {
    (:Row { r :: RECORD {} })
}
