-- fieldType with its `typed?` elided (GQL.g4:1997): `f STRING` rather than
-- `f :: STRING`. The field-type twin of 18.2's pattern_property_typed_elided.gql,
-- and it has to be written here because clause 18.10 owns no files — a field type
-- is spellable only inside a record or binding table type. See ownershipOnlyPrefixes.
--
-- The elision is invisible in the resolved type, and this file does not assert
-- that: the corpus records that the spelling resolves, never to what. The claim
-- that `typed` is punctuation carrying nothing is asserted by the two rows of
-- TestRecordPropertyResolves that spell `a :: INT` and `a INT` and want the same
-- string. This file pinned a decline until gqlc-h9n.33 gave records an encoding
-- (ADR 0037), and a decline could not have distinguished the two spellings at all.
CREATE PROPERTY GRAPH TYPE Seed AS {
    (:Row { r :: RECORD { f STRING } })
}
