-- Every value-type decline in the corpus is written as a pattern-form node, so
-- the whole of 18.9's unsupported-type coverage lands on EnterNodeTypePattern's
-- error arm. EnterNodeTypePhrase has its own `if err != nil { l.fail(err) }`, and
-- dropping the l.fail from it left the suite green — a phrase-form node carrying
-- an unsupported property type would have been silently discarded, taking its
-- node out of the schema without a diagnostic.
--
-- Unsupported: ErrPathValueType (gqlc-0ri). The value type is incidental —
-- 18.9-value-type/constructed_path.gql pins that PATH declines. What this file
-- pins is that the phrase-form collector forwards the decline at all. It spelled
-- RECORD until gqlc-h9n.33 made records resolve; the family was swapped rather
-- than the entry demoted, because a resolving value type discharges nothing here.
CREATE PROPERTY GRAPH TYPE T AS {
    NODE TYPE Bag :Bag { route :: PATH } AS b
}
