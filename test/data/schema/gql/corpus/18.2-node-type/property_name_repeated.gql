-- The same property name declared twice in one propertyTypeList. The ISO BNF
-- admits it — <property type list> ::= <property type> [{ <comma> <property
-- type> }...] states no uniqueness constraint — so it parses. gqlc rejects it
-- with ErrDuplicatePropertyName.
--
-- That rejection is ADR 0030, and it is provisional by construction. The free
-- BNF settles the SYNTAX and nothing else; whether a repeat is an error is
-- Syntax Rules prose in the paid PDF gqlc-lir declined to buy. Two readings
-- were defensible — reject, or define a precedence between the two
-- declarations — and rejection is the interim posture on the same grounds as
-- ErrEdgeKindArcMismatch: it is the only one of the two that cannot be wrong
-- silently. gqlc-tlbo revisits it if the clause is ever bought.
--
-- Until gqlc-4np this file resolved, to ONE property, the last one.
-- listener.properties built a map keyed by name and wrote every element of the
-- list into it in walk order, so the second `id` overwrote the first and took
-- its INT and its NOT NULL with it, and nothing anywhere said so. gqlc
-- rejected a duplicate node type and a duplicate edge type on exactly the
-- reasoning that a map keyed by identity cannot hold two things under one key,
-- and this was the one duplicate it did not reject.
CREATE PROPERTY GRAPH TYPE T AS {
    (:Person { id :: INT NOT NULL, id :: STRING })
}
