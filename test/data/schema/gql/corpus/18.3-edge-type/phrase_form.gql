-- The nodes are in pattern form and the edge in phrase form, so the two spellings
-- are mixed in one body. edgeKind is mandatory in edgeTypePhrase, unlike in
-- edgeTypePattern.
CREATE PROPERTY GRAPH TYPE T AS {
    (a :Person { id :: INT NOT NULL }),
    (b :Post { id :: INT NOT NULL }),
    DIRECTED EDGE TYPE Wrote :WROTE { since :: TIMESTAMP } CONNECTING (a -> b)
}
