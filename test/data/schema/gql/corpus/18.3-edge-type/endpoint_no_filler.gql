-- destinationNodeTypeReference alternative 2 with its `nodeTypeFiller?` elided
-- (GQL.g4:1620, 1625): an endpoint spelled `()`. Every other endpoint in the
-- corpus names a node type, by alias or by inline filler.
--
-- ADR 0021 settles the reading: `()` names the node type whose key label set is
-- empty. `nodeTypeFiller` specifies a node type; when it is absent the
-- specification is empty, i.e. the empty label set. resolve() looks up that key
-- and does not find it — ADR 0018 rejects every declaration of an empty-label
-- node type — so the endpoint is undeclarable rather than merely undeclared.
-- ErrUnknownEndpoint's message ("references an undeclared node type") is
-- accurate under this reading, if weak in not distinguishing the two cases.
CREATE PROPERTY GRAPH TYPE T AS {
    (:Person { id :: INT NOT NULL }),
    (:Person) -[:AUTHORED]-> ()
}
