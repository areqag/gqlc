-- Serves the ref-valued-leaf certificate rows (gqlc-t0bk). `rank` is INT32
-- against `id`'s INT so the width row has two integers the resolver must
-- refuse to unify: ADR 0002 preserves widths, and numeric widening is
-- deliberately not inferred.
--
-- `meta` is the min/max selection rows' NEGATIVE operand (gqlc-b8m8f, spec
-- ruling-p9qgu §3.1): ANY is outside orderableSelection's allow-list, so
-- min(p.meta) stays `any` where min(p.rank) commits INT32. Every other
-- property here is orderable, so without it that arm has no corpus witness.
--
-- It is ANY and not the ruling's named BYTES because this schema has to stay
-- codegen-admissible on BOTH backends — TestResolverValidCorpusStageBoundary
-- reads the README's single partition, and AGE refuses a BYTES property at
-- SCHEMA admission ("BYTES has no agtype scalar at all", age/types.go) while
-- neo4j carries it as []byte. A BYTES row here would be refused before any
-- query was looked at, so it would witness nothing about min. BYTES itself is
-- held by TestOrderableSelectionNamesEveryPropertyType, which needs no schema.
CREATE PROPERTY GRAPH TYPE Certificate AS {
    (:Person {
        id   :: INT NOT NULL,
        age  :: INT,
        name :: STRING NOT NULL,
        rank :: INT32 NOT NULL,
        meta :: ANY VALUE
    })
}
