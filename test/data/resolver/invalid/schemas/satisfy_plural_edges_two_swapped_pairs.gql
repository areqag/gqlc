-- Plural label satisfaction (ADR 0022) on BOTH endpoints, with every key of
-- the resulting 2x2 cross-product declared — so the candidate set carries two
-- disjoint swapped pairs rather than one.
--
-- `(:Person)` is satisfied by two declared types and so is `(:Company)`, so
-- `(a:Person)-[r:REVIEWED]-(b:Company)` has
--   srcs = { Employee&Person , Person }
--   tgts = { Company , Company&Startup }
-- and the four declarations below close to
--   { Employee&Person-[REVIEWED]->Company&Startup
--   , Company&Startup-[REVIEWED]->Employee&Person
--   , Person-[REVIEWED]->Company
--   , Company-[REVIEWED]->Person }
-- in probe order. Each pair on its own is a complete orientation disagreement
-- in the sense R3 §4.6 case C names, so either pair would be a truthful answer
-- and only the scan order decides which the refusal reports. §4.4 says the
-- first witness on each side wins; this schema is what makes that observable,
-- because every other undirected schema in this directory declares one pair and
-- there is nothing for it to be first *of*.
--
-- The two subtypes are declared only against each other, and the two supertypes
-- only against each other, so the pairs do not overlap. That is deliberate: a
-- shared key would put one candidate in both pairs and the set would no longer
-- distinguish "first witness" from "only witness".

CREATE PROPERTY GRAPH TYPE SatisfyPluralEdgesTwoSwappedPairs AS {

    (:Person {
        id   :: INT NOT NULL,
        name :: STRING NOT NULL
    }),

    (:Person&Employee {
        id         :: INT NOT NULL,
        name       :: STRING NOT NULL,
        employeeId :: INT NOT NULL
    }),

    (:Company {
        id   :: INT NOT NULL,
        name :: STRING NOT NULL
    }),

    (:Company&Startup {
        id          :: INT NOT NULL,
        name        :: STRING NOT NULL,
        foundedYear :: INT NOT NULL
    }),

    (:Person&Employee) -[:REVIEWED { rating :: INT NOT NULL }]-> (:Company&Startup),
    (:Company&Startup) -[:REVIEWED { rating :: INT NOT NULL }]-> (:Person&Employee),
    (:Person)          -[:REVIEWED { rating :: INT NOT NULL }]-> (:Company),
    (:Company)         -[:REVIEWED { rating :: INT NOT NULL }]-> (:Person)

}
