-- Plural label satisfaction (ADR 0022) where BOTH endpoint labels are satisfied
-- by two declared types, and the two WORKS_AT declarations pair them off.
--
-- `(:Person)` is satisfied by Person and Employee&Person; `(:Company)` by
-- Company and Company&Large. `MATCH (c:Company) RETURN c` is ambiguous over
-- both company types, which is this schema's own statement that a Company&Large
-- node matches `(:Company)`.
--
-- The point of the schema is the anonymous endpoint spelling
-- `(p:Person)-[:WORKS_AT]->(:Company)`. Both declared WORKS_AT edges match it,
-- so `p` is still either person type, and the row Employee&Person -[WORKS_AT]->
-- Company&Large has a `p` with no personOnly.
--
-- `smallOnly` and `largeId` are the two directions of the same question asked
-- of the OTHER end: each company type carries one property the other lacks, so
-- an unlabelled `(c)` pinned to either one alone offers a column the rows
-- carrying the other do not have.
--
-- HAS_DESK is declared from the BARE Company only, which is what lets a hop
-- through it pin an unlabelled `(c)` to Company where the WORKS_AT edges alone
-- leave it plural. Reached through an OPTIONAL MATCH that hop is an outer join
-- and filters no row, so the Employee&Person -[WORKS_AT]-> Company&Large row
-- still comes back — with `h`/`d` null — and the same wrong `p` follows. It is
-- the inline-endpoint defect above with the under-enumerated far end replaced
-- by a perfectly enumerated one on an edge that is not evidence.

CREATE PROPERTY GRAPH TYPE SatisfyPluralEdgesInlineSubtype AS {

    (:Person {
        id         :: INT NOT NULL,
        name       :: STRING NOT NULL,
        personOnly :: STRING NOT NULL
    }),

    (:Person&Employee {
        id         :: INT NOT NULL,
        name       :: STRING NOT NULL,
        employeeId :: INT NOT NULL
    }),

    (:Company {
        id        :: INT NOT NULL,
        name      :: STRING NOT NULL,
        smallOnly :: STRING NOT NULL
    }),

    (:Company&Large {
        id      :: INT NOT NULL,
        name    :: STRING NOT NULL,
        largeId :: INT NOT NULL
    }),

    (:Desk {
        id :: INT NOT NULL
    }),

    (:Person)          -[:WORKS_AT { since :: INT NOT NULL }]-> (:Company),
    (:Person&Employee) -[:WORKS_AT { since :: INT NOT NULL }]-> (:Company&Large),

    (:Company)         -[:HAS_DESK { n :: INT NOT NULL }]-> (:Desk)

}
