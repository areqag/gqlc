-- Exercises label satisfaction under ADR 0022 (option B): satisfaction is
-- satisfaction, so `MATCH (p:Person)` satisfies both (:Person) and
-- (:Person&Employee). Property intersection requires a shared property on both.
-- The `id` property is shared (same type and nullability) to allow
-- label_satisfy_plural_intersection.cypher to pass.

CREATE PROPERTY GRAPH TYPE SatisfySingular AS {

    (:Person {
        id   :: INT NOT NULL,
        name :: STRING NOT NULL
    }),

    (:Person&Employee {
        id         :: INT NOT NULL,
        employeeId :: INT NOT NULL,
        title      :: STRING
    })

}
