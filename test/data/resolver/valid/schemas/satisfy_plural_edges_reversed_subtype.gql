-- The valid-corpus copy of the §4.6.1 reversed-subtype schema. The harness
-- resolves schemas per fixture subdir (loadSchema(subdir, name)), so valid/ and
-- invalid/ each hold their own; the invalid/ copy carries the refusal's
-- rationale. This header describes what the copy in THIS directory is for.
--
-- `(:Author)` is satisfied by both declared author types, and REVIEWED is
-- declared `Author -> Book` forward and `Book -> Author&Editor` reverse. The
-- one fixture here is the DIRECTED twin:
--   `(a:Author)-[r:REVIEWED]->(b:Book)`
-- which drops the right-to-left probe and closes to the single key
-- `Author-[REVIEWED]->Book`, so §4.6 case B types it. That is the fact case C's
-- advice depends on — if the arrow closed to two candidates as well, refusing
-- the undirected form would be advice the author cannot act on.
--
-- The undirected form on this same schema is refused; that claim is asserted
-- against ONE parsed schema by TestAmbiguousOrientationRemedyIsTheArrow, so it
-- does not rest on these two files staying byte-identical.

CREATE PROPERTY GRAPH TYPE SatisfyPluralEdgesReversedSubtype AS {

    (:Author {
        id   :: INT NOT NULL,
        name :: STRING NOT NULL
    }),

    (:Author&Editor {
        id   :: INT NOT NULL,
        name :: STRING NOT NULL,
        desk :: INT NOT NULL
    }),

    (:Book {
        id    :: INT NOT NULL,
        title :: STRING NOT NULL
    }),

    (:Author) -[:REVIEWED { rating :: INT NOT NULL }]-> (:Book),
    (:Book)   -[:REVIEWED { rating :: INT NOT NULL }]-> (:Author&Editor)

}
